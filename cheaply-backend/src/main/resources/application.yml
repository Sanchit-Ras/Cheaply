server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: cheaply-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cheaply_db}
    username: ${SPRING_DATASOURCE_USERNAME:cheaply_user}
    # No default: supplied by docker-compose from .env, or set explicitly
    # when running the app outside Docker.
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000

  jpa:
    # Schema is owned by Flyway. Hibernate only verifies that the entities
    # match the migrated schema; it never alters it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

cheaply:
  scraper:
    url: ${SCRAPER_SERVICE_URL:http://localhost:5000}
    # Must exceed the scraper's own worst-case budget. The Python service
    # scrapes three stores in parallel, each with retries, so a cold call can
    # legitimately take ~45s. See SCRAPER_TOTAL_BUDGET_SECONDS on that service.
    read-timeout-ms: ${SCRAPER_READ_TIMEOUT_MS:60000}
    connect-timeout-ms: ${SCRAPER_CONNECT_TIMEOUT_MS:5000}
    api-key: ${SCRAPER_API_KEY:}

  jwt:
    # No default. The application refuses to start without an explicit secret
    # of at least 32 bytes - see JwtService#validateConfiguration.
    secret: ${JWT_SECRET:}
    access-token-expiration-ms: ${JWT_ACCESS_TTL_MS:900000}      # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TTL_MS:604800000} # 7 days

  cache:
    search-ttl-minutes: ${SEARCH_CACHE_TTL_MINUTES:15}
    # Partial results (one or more stores failed) are cached far more briefly
    # so a transient store outage does not poison the cache for 15 minutes.
    partial-search-ttl-minutes: ${SEARCH_CACHE_PARTIAL_TTL_MINUTES:3}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    search-capacity: ${RATE_LIMIT_SEARCH_CAPACITY:10}
    search-window-seconds: ${RATE_LIMIT_SEARCH_WINDOW_SECONDS:60}
    auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
    auth-window-seconds: ${RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.cheaply: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
