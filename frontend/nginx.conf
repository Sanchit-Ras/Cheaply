server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy. The read timeout must sit above the backend's 60s scraper
    # budget or nginx would cut off cold searches at its 60s default.
    location /api/ {
        proxy_pass http://cheaply-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }

    location = /actuator/health {
        proxy_pass http://cheaply-backend:8080;
    }

    # SPA fallback: any unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
